services:
  postgres:
    image: postgres:16-alpine
    container_name: clubportal-postgres
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: clubportal
    ports:
      - "5432:5432"
    volumes:
      - club_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d clubportal"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  club_pg:
